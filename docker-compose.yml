version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: titan_agents
    ports:
      - "5432:5432"
    volumes:
      - titan_pg_data:/var/lib/postgresql/data

  coordinator:
    build: ./shared/planner
    ports:
      - "5001:5001"
    environment:
      - POSTGRES_DSN=postgres://titan:changeme@postgres:5432/titan_agents
    depends_on:
      - postgres

  dashboard:
    build: ./dashboard
    ports:
      - "3002:3002"
    depends_on:
      - coordinator

volumes:
  titan_pg_data:
